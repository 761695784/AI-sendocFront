# DocTrack sur Netlify, avec rendu serveur Angular (plugin @netlify/angular-runtime).
# - Le rendu serveur passe par server.ts (format imposé par Netlify) et tourne en « edge function ».
# - Pages fixes (à propos, connexion…) pré-générées au build ; espaces connectés rendus dans le navigateur.
# - Hébergement Docker / VPS : voir Dockerfile (serveur Express dans server.node.ts).

[build]
  command = "npx ng build"
  publish = "dist/doc-track-front/browser"

[build.environment]
  NODE_VERSION = "24"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# Pas de redirection « /* » : c'est la fonction de rendu Angular qui répond à toutes les adresses
# sans fichier (elle renvoie elle-même la page à rendre dans le navigateur pour les espaces connectés).

# Fichiers avec empreinte : en cache un an. Service worker, manifeste et pages : toujours revalidés.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/ngsw*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/safety-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# En-têtes de sécurité (identiques à ceux du serveur Node).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(self), payment=()"
